[package]
name = "fariv-million-live"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["embedded"]
embedded = ["duckdb/bundled", "duckdb/parquet"]

[dependencies]
duckdb = { version = "=1.20000.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
strip = true
