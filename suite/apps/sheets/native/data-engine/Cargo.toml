[package]
name = "data-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Fariv large-table engine: delimited import into DuckDB, windowed reads, find"

[features]
default = ["embedded"]
# DuckDB compiled into the binary, Parquet included: the app must work offline,
# and without `parquet` DuckDB tries to download the extension on first use.
embedded = ["duckdb/bundled", "duckdb/parquet"]

[dependencies]
duckdb = { version = "=1.20000.1", default-features = false }
encoding_rs = "0.8"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
rust_xlsxwriter = { version = "0.102", default-features = false, features = ["constant_memory"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
