name: Farcel
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  aggregation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run bench
      - run: npm run probe:ironcalc
      - run: npm run bench:ironcalc
      - uses: actions/upload-artifact@v4
        with:
          name: technical-proof-${{ matrix.os }}
          path: reports/*.json
  app:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  xlsx-bridge:
    # The XLSX converter is committed prebuilt (vendor/xlsx-bridge). Rebuild it from
    # native/xlsx-bridge and require byte-identical output, so the binary matches its source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
          key: xlsx-bridge-${{ hashFiles('native/xlsx-bridge/Cargo.lock', 'native/xlsx-bridge/rust-toolchain.toml') }}
      - run: |
          version="$(grep -A1 '^name = "wasm-bindgen"$' native/xlsx-bridge/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
          command -v wasm-bindgen >/dev/null && [ "$(wasm-bindgen --version | cut -d' ' -f2)" = "$version" ] || cargo install wasm-bindgen-cli --version "$version" --locked
      - run: bash native/xlsx-bridge/build.sh
      - run: git diff --exit-code vendor/xlsx-bridge

