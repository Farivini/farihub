name: Farcel
# The Farihub web app at the repository root (src/, native/, vendor/, tests/). It does not
# depend on suite/ or docs/, so changes there no longer run it; a branch push runs once,
# through its PR, and `push` covers main.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'vendor/**'
      - 'tests/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/technical-proof.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'native/**'
      - 'vendor/**'
      - 'tests/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/technical-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: farcel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aggregation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run bench
      - run: npm run probe:ironcalc
      - run: npm run bench:ironcalc
      - uses: actions/upload-artifact@v4
        with:
          name: technical-proof-${{ matrix.os }}
          path: reports/*.json
          retention-days: 7
  app:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  xlsx-bridge:
    # The XLSX converter is committed prebuilt (vendor/xlsx-bridge). Rebuild it from
    # native/xlsx-bridge and require byte-identical output, so the binary matches its source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
          key: xlsx-bridge-${{ hashFiles('native/xlsx-bridge/Cargo.lock', 'native/xlsx-bridge/rust-toolchain.toml') }}
      - run: |
          version="$(grep -A1 '^name = "wasm-bindgen"$' native/xlsx-bridge/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
          command -v wasm-bindgen >/dev/null && [ "$(wasm-bindgen --version | cut -d' ' -f2)" = "$version" ] || cargo install wasm-bindgen-cli --version "$version" --locked
      # Installs the Rust version and wasm32 target pinned in rust-toolchain.toml.
      - run: rustup toolchain install
        working-directory: native/xlsx-bridge
      - run: bash native/xlsx-bridge/build.sh
      - run: git diff --exit-code vendor/xlsx-bridge

