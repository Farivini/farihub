name: Suite
# The Fariv suite (suite/: Planilhas, Documentos, Apresentações on the GenOffice OSS base).
# Tests and Electron e2e on Linux on every PR. The Windows installer (unsigned: signing needs
# Fariv's certificate, not configured here) is built on main, on demand (Run workflow), and on
# a PR only when it carries the `instalador` label — it is the costliest job (Windows minutes
# count double) and its 158 MB artifact is what filled the Actions storage quota.
#
# One run per change: a branch push runs only through its PR (pull_request), not twice
# (push + pull_request); `push` covers main.
on:
  push:
    branches: [main]
    paths: ['suite/**', '.github/workflows/suite.yml']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['suite/**', '.github/workflows/suite.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A label event gets its own group (per label): adding `instalador` or any other label
  # must not cancel the tests and e2e still running for the same commit. A new push still
  # cancels the previous run of the PR.
  group: >-
    suite-${{ github.ref }}-${{ github.event.action == 'labeled' &&
    format('label-{0}', github.event.label.name) || 'run' }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: suite
jobs:
  test:
    # adding a label (e.g. `instalador`) must not re-run the whole suite
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: suite/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            suite/apps/sheets/native/xlsx-engine
            suite/apps/sheets/native/data-engine
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-bin-${{ runner.os }}-${{ hashFiles('suite/package-lock.json') }}
          restore-keys: electron-bin-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      # Every npm dependency must carry a licence on the allowlist (tools/check-licenses.mjs).
      - run: npm run licenses
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
          manifest-path: suite/apps/sheets/native/xlsx-engine/Cargo.toml
      - run: npm run typecheck
      # pptx-engine validates saved decks with xmllint.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
        working-directory: .
      - run: npm test

  e2e:
    if: github.event.action != 'labeled'
    # 22.04: 24.04's AppArmor hardening blocks the Electron renderer under xvfb.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: suite/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            suite/apps/sheets/native/xlsx-engine
            suite/apps/sheets/native/data-engine
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-bin-${{ runner.os }}-${{ hashFiles('suite/package-lock.json') }}
          restore-keys: electron-bin-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - run: npm run build:all
      - run: npm run fixtures -w @genoffice/sheets
      - name: Allow unprivileged user namespaces (Electron)
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # The Fariv flows (open, edit, save and reopen in the three formats; review and undo)
      # plus the upstream smoke tests they build on.
      - run: xvfb-run --auto-servernum -- npm run test:e2e:fariv
      # always: the screenshots are the PR's visual evidence (review cards, identity, round trips)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-e2e-artifacts
          path: |
            suite/e2e/artifacts
            suite/e2e/test-results
          retention-days: 3

  windows:
    # main, Run workflow, or a PR labelled `instalador` (see the header)
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'instalador') &&
       (github.event.action != 'labeled' || github.event.label.name == 'instalador'))
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: suite/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            suite/apps/sheets/native/xlsx-engine
            suite/apps/sheets/native/data-engine
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck -w @genoffice/shell
      # notices + build:all (with the Rust sidecar, MSVC) + electron-builder --win.
      # `--publish never` must reach electron-builder: passed after `-w` and `--` in the
      # script, otherwise npm takes `--publish` as its own option and `never` as a target.
      - run: npm run dist:win:nopublish
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: fariv-windows-installer
          path: |
            suite/apps/shell/release/*.exe
            suite/apps/shell/release/*.yml
          if-no-files-found: error
          retention-days: 5
