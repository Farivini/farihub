[package]
name = "farcel-xlsx-bridge"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "XLSX <-> IronCalc workbook bytes, using IronCalc's own importer and exporter"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Must match @ironcalc/wasm exactly: the bridge exchanges Model.toBytes() data,
# whose layout belongs to ironcalc_base.
ironcalc = "=0.9.1"
ironcalc_base = "=0.9.1"
bitcode = "0.6.9"
serde_json = "1.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
